name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The full suite passes on Windows when run serially; parallel workers make
      # timing-sensitive assertions flaky. Keep the whole suite, one worker.
      - run: pnpm exec vitest run --maxWorkers=1

  package:
    needs: [test, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the tarball used by the CI smoke
        run: |
          mkdir -p "$RUNNER_TEMP/ci-smoke-tarball"
          # CI-only artifact: it is consumed by release-smoke below. It is NOT
          # the official release attachment -- that is the Windows-built tarball
          # the release owner uploads manually, and the two may differ in bytes.
          # Build already produced lib/; --ignore-scripts keeps this artifact
          # identical to what the gates just validated.
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/ci-smoke-tarball"
          cd "$RUNNER_TEMP/ci-smoke-tarball"
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-tarball
          path: ${{ runner.temp }}/ci-smoke-tarball
          if-no-files-found: error
          retention-days: 7

  release-smoke:
    needs: [package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exact host versions the release must load on. rc.5 stays as the
        # regression baseline; Alpha.2 is the newly supported release.
        host-version: ['0.2.2-rc.5', '0.2.3-alpha.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The dsh plugin manager shells out to pnpm to install the tarball.
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@v4
        with:
          name: ci-smoke-tarball
          path: ${{ runner.temp }}/ci-smoke-tarball
      - name: Verify the tarball checksum recorded by the package job
        run: |
          cd "$RUNNER_TEMP/ci-smoke-tarball"
          sha256sum -c SHA256SUMS
      - name: Install and load the release tarball on an isolated host
        env:
          HOST_VERSION: ${{ matrix.host-version }}
        run: |
          TARBALL=$(ls "$RUNNER_TEMP"/ci-smoke-tarball/*.tgz)
          node scripts/release-ci-smoke.mjs \
            --host-version "$HOST_VERSION" \
            --tarball "$TARBALL" \
            --work-dir "$RUNNER_TEMP/smoke-$HOST_VERSION"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-test, package, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated release tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Create GitHub Release from annotated tag notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const tag = process.env.GITHUB_REF_NAME;
          const expectedTag = `v${JSON.parse(readFileSync('package.json', 'utf8')).version}`;
          if (tag !== expectedTag) {
            throw new Error(`Tag ${tag} does not match package version ${expectedTag}`);
          }

          const annotatedTag = execFileSync('git', ['cat-file', 'tag', `refs/tags/${tag}`], {
            encoding: 'utf8',
          });
          const headerEnd = annotatedTag.indexOf('\n\n');
          if (headerEnd < 0) throw new Error(`Tag ${tag} is not annotated`);
          const body = annotatedTag.slice(headerEnd + 2).trim();
          if (!body || body === `Release ${tag}`) {
            throw new Error(`Tag ${tag} has no release notes. Add Markdown notes to the annotated tag message.`);
          }

          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const existing = await fetch(`${api}/releases/tags/${encodeURIComponent(tag)}`, { headers });
          if (existing.ok) {
            console.log(`Release ${tag} already exists; skipping creation.`);
            process.exit(0);
          }
          if (existing.status !== 404) {
            throw new Error(`Could not check existing release: ${existing.status} ${await existing.text()}`);
          }

          const response = await fetch(`${api}/releases`, {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tag_name: tag,
              name: tag,
              body,
              draft: false,
              prerelease: tag.includes('-'),
              generate_release_notes: false,
            }),
          });
          if (!response.ok) {
            throw new Error(`Could not create release: ${response.status} ${await response.text()}`);
          }
          console.log(`Created GitHub Release for ${tag}.`);
          NODE
